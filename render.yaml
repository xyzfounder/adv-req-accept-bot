
services:
  - type: web
    name: telegram-auto-approver
    runtime: python
    plan: starter

    buildCommand: pip install -r requirements.txt
    startCommand: python main.py

    healthCheckPath: /health

    envVars:
      - key: BOT_TOKEN
        sync: false

      - key: ADMIN_ID
        value: "255448871"

      - key: AUTO_APPROVE
        value: "true"

      - key: WELCOME_MESSAGE
        value: |-
          Hey {first_name}
          Your request to join our channel has been approved.
          This is advanced autorequest accept bot

          Powered By : @AnimeNetworkTamil


      - key: START_MESSAGE
        value: |-
          Hey {first_name}
          This is advanced autorequest accept bot

          Powered by - @AnimeNetworkTamil
